function showLanguage(lang) {
  const p = policies[lang] || policies.en;
  document.documentElement.lang = lang;
  document.getElementById("language").value = lang;

  const escapeHTML = value => String(value).replace(
    /[&<>"']/g,
    c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[c]
  );

  document.getElementById("content").innerHTML =
    `<h1>${escapeHTML(p.title)}</h1>
     <div class="warning">${escapeHTML(p.warning)}</div>
     <h2>${escapeHTML(p.controller)}</h2>
     ${contact}
     <p>${escapeHTML(p.intro)}</p>` +
    p.sections.map(section =>
      `<section>
        <h2>${escapeHTML(section[0])}</h2>
        <p>${escapeHTML(section[1])}</p>
      </section>`
    ).join("");

  const url = new URL(window.location.href);
  url.searchParams.set("lang", lang);
  history.replaceState(null, "", url);
}

const requested = new URLSearchParams(location.search).get("lang");
const browserLanguage = (navigator.language || "en").slice(0, 2);
const initialLanguage =
  policies[requested] ? requested :
  policies[browserLanguage] ? browserLanguage : "en";

showLanguage(initialLanguage);
</script>
